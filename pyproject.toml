[project]
name = "media-control"
version = "0.1.0"
description = "Monitor y Control Multimedia — Apple Music PWA remote control"
requires-python = ">=3.11"

[tool.mypy]
strict = true
python_version = "3.11"
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
exclude = ["/.venv/"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
